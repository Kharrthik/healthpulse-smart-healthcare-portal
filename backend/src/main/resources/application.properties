# Server Configuration
server.port=8080

# Application Details
spring.application.name=teleconsult

# Default Profile: 'mysql' since MySQL is running on port 3306 with health_portal_app
spring.profiles.default=mysql

# Common Hibernate / JPA settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Groq AI Service Configuration (Runtime AI Assistant)
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Logging
logging.level.com.healthcare.teleconsult=INFO
